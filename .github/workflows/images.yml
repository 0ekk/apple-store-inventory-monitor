name: Images

# Container images for the headless deployment (docs/headless-deploy.md):
# every commit on main is built for linux/amd64 and linux/arm64 and pushed
# to GHCR as ghcr.io/<owner>/<image>:sha-<short sha>, a multi-arch tag the
# manifests in deploy/k8s/ can pin.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # One image failing must not cancel the other one's build.
      fail-fast: false
      matrix:
        include:
          - image: apw-monitor
            context: .
            dockerfile: crates/apw-headless/Dockerfile
          - image: apw-camoufox-sidecar
            context: camoufox-sidecar
            dockerfile: camoufox-sidecar/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # One buildx build per image produces both architectures. The
      # monitor cross-compiles on the runner and only its final stage runs
      # as arm64; the sidecar installs arm64 packages and the arm64 browser,
      # so its whole arm64 build runs under QEMU.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # Buildx is required for multi-platform builds and the GitHub Actions
      # layer cache below.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # type=sha gives sha-<7-char sha>. The OCI labels it emits
      # (org.opencontainers.image.source) link the package to this repo.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
